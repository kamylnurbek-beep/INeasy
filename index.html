<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok HD Patcher</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="glass-card">
            <div class="header">
                <div class="logo">⚡️</div>
                <h1>HD Patcher</h1>
                <p>Обход сжатия TikTok • Локально</p>
            </div>

            <div id="engineStatus" class="status-badge loading">
                <span class="spinner"></span> Загрузка движка...
            </div>

            <label class="upload-btn" id="uploadLabel">
                <input type="file" id="fileInput" accept="video/*" hidden>
                <span>Выбрать видео</span>
            </label>

            <div id="fileInfo" class="info-box hidden">
                <div class="info-row">
                    <span>Файл:</span>
                    <strong id="fileName">-</strong>
                </div>
                <div class="info-row">
                    <span>Размер:</span>
                    <strong id="fileSize">-</strong>
                </div>
            </div>

            <button id="processBtn" class="action-btn hidden" disabled>
                Запустить патч
            </button>

            <div id="progressArea" class="hidden">
                <div class="progress-track">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
                <p id="statusText" class="status-msg">Подготовка...</p>
            </div>

            <div id="resultArea" class="hidden">
                <div class="success-icon">✅</div>
                <h3>Патч применен!</h3>
                <p>Видео готово к загрузке без потери качества.</p>
                <a id="downloadLink" class="download-btn" download="tiktok_hd.mp4">Скачать файл</a>
            </div>
            
            <div id="errorArea" class="hidden error-box">
                <p>⚠️ Ошибка: Видео слишком большое или не хватило памяти iPhone. Попробуйте файл меньше 500 МБ.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
